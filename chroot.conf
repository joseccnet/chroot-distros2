# ==============================================================================
# Paquetes para Debian - Específicos por versión
# ==============================================================================
# Debian genérico (fallback)
paquetesAdicionalesDeb="iputils-ping,default-mysql-client,vim,openssh-server,rsyslog,locales,locales-all,libc6"

# Debian moderno (12+): sin locales-all separado, librerías actualizadas
paquetesAdicionalesDeb14_forky="iputils-ping,default-mysql-client,vim,openssh-server,rsyslog,locales,locales-all,libc6,debian-keyring"
paquetesAdicionalesDeb13_trixie="iputils-ping,default-mysql-client,vim,openssh-server,rsyslog,locales,locales-all,libc6,debian-keyring"
paquetesAdicionalesDeb12_bookworm="iputils-ping,default-mysql-client,vim,openssh-server,rsyslog,locales,locales-all,libc6"

# Debian legacy (9-11)
paquetesAdicionalesDeb11_bullseye="iputils-ping,default-mysql-client,vim,openssh-server,rsyslog,locales,locales-all,libc6"
paquetesAdicionalesDeb10_buster="iputils-ping,default-mysql-client,vim,openssh-server,rsyslog,locales,locales-all,libc6"
paquetesAdicionalesDeb9_stretch="iputils-ping,default-mysql-client,vim,openssh-server,rsyslog,locales,locales-all,libc6"

# Debian antiguo (6-8): mysql-client en lugar de default-mysql-client
paquetesAdicionalesDeb8_jessie="iputils-ping,mysql-client,vim,openssh-server,rsyslog,locales,locales-all,libc6"
paquetesAdicionalesDeb7_wheezy="iputils-ping,mysql-client,vim,openssh-server,rsyslog,locales,locales-all,libc6"
paquetesAdicionalesDeb6_squeeze="iputils-ping,mysql-client,vim,openssh-server,rsyslog,locales,locales-all,libc6"

# Alias numéricos para compatibilidad hacia atrás
#mariadb-client reemplaza a mysql-client. Instalar manualmente si se necesita en Kali,Debian9.
paquetesAdicionalesDeb9="$paquetesAdicionalesDeb9_stretch"
paquetesAdicionalesDeb10="$paquetesAdicionalesDeb10_buster"
paquetesAdicionalesDeb11="$paquetesAdicionalesDeb11_bullseye"
paquetesAdicionalesDeb12="$paquetesAdicionalesDeb12_bookworm"
paquetesAdicionalesDeb13="$paquetesAdicionalesDeb13_trixie"
paquetesAdicionalesDeb14="$paquetesAdicionalesDeb14_forky"

# Función para obtener paquetes específicos según la versión de Debian
obtener_paquetes_debian() {
    local version="${1:-}"
    local nombre_var="paquetesAdicionalesDeb14_${version}"

    # Mapear codenames a variables
    case "$version" in
        fork*)   nombre_var="paquetesAdicionalesDeb14_forky" ;;
        trixie*) nombre_var="paquetesAdicionalesDeb13_trixie" ;;
        book*)   nombre_var="paquetesAdicionalesDeb12_bookworm" ;;
        bull*)   nombre_var="paquetesAdicionalesDeb11_bullseye" ;;
        bust*)   nombre_var="paquetesAdicionalesDeb10_buster" ;;
        stretch*)nombre_var="paquetesAdicionalesDeb9_stretch" ;;
        jessie*) nombre_var="paquetesAdicionalesDeb8_jessie" ;;
        wheezy*) nombre_var="paquetesAdicionalesDeb7_wheezy" ;;
        squeeze*)nombre_var="paquetesAdicionalesDeb6_squeeze" ;;
        sid*)    nombre_var="paquetesAdicionalesDeb" ;;
        *)       nombre_var="paquetesAdicionalesDeb" ;;
    esac

    if [ -n "${!nombre_var}" ]; then
        echo "${!nombre_var}"
    else
        echo "$paquetesAdicionalesDeb"
    fi
}

# ==============================================================================
# Paquetes para Kali Linux
# ==============================================================================
# Kali es rolling, solo hay kali-rolling activo actualmente
paquetesAdicionalesKali="iputils-ping,default-mysql-client,vim,openssh-server,rsyslog,locales,locales-all,libc6,kali-archive-keyring"

# Función para obtener paquetes de Kali (actualmente solo rolling)
obtener_paquetes_kali() {
    local version="${1:-}"
    case "$version" in
        kali-rolling|kali*)
            echo "$paquetesAdicionalesKali"
            ;;
        sana)
            # Versión legacy
            echo "iputils-ping,mysql-client,vim,openssh-server,rsyslog,locales,locales-all,libc6"
            ;;
        *)
            echo "$paquetesAdicionalesKali"
            ;;
    esac
}

