paquetesAdicionalesDevuan_daedalus="iputils-ping,default-mysql-client,vim,openssh-server,rsyslog,locales,locales-all,libc6,devuan-keyring"

# Devuan legacy (3-4)
paquetesAdicionalesDevuan_chimaera="iputils-ping,default-mysql-client,vim,openssh-server,rsyslog,locales,locales-all,libc6"
paquetesAdicionalesDevuan_beowulf="iputils-ping,default-mysql-client,vim,openssh-server,rsyslog,locales,locales-all,libc6"

# Devuan antiguo (1-2)
