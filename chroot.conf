paquetesAdicionalesDevuan_jessie="iputils-ping,mysql-client,vim,openssh-server,rsyslog,locales,locales-all,libc6"

# Default (moderno)
paquetesAdicionalesDevuan="iputils-ping,default-mysql-client,vim,openssh-server,rsyslog,locales,locales-all,libc6,devuan-keyring"

# Función para obtener paquetes específicos según versión de Devuan
obtener_paquetes_devuan() {
    local version="${1:-}"
    local nombre_var="paquetesAdicionalesDevuan"

    case "$version" in
        excalibur|ceres)  nombre_var="paquetesAdicionalesDevuan_excalibur" ;;
        daedalus)         nombre_var="paquetesAdicionalesDevuan_daedalus" ;;
        chimaera)         nombre_var="paquetesAdicionalesDevuan_chimaera" ;;
        beowulf|buster)   nombre_var="paquetesAdicionalesDevuan_beowulf" ;;
        ascii|stretch)    nombre_var="paquetesAdicionalesDevuan_ascii" ;;
        jessie)           nombre_var="paquetesAdicionalesDevuan_jessie" ;;
        *)                nombre_var="paquetesAdicionalesDevuan" ;;
    esac

    if [ -n "${!nombre_var}" ]; then
        echo "${!nombre_var}"
    else
        echo "$paquetesAdicionalesDevuan"
    fi
}

